name: Build and Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Step 3: Install dependencies and Build frontend
      - name: Install and Build Frontend
        run: |
          cd frontend
          echo "VITE_BASE_URL=https://infinitocomics-68cr.onrender.com" > .env
          echo "VITE_RESEARCH_BASE_URL=https://research.infinitohq.com" >> .env
          echo "VITE_FOUNDATION_BASE_URL=https://foundation.infinitohq.com" >> .env
          echo "VITE_FRONTEND_BASE_URL=https://infinitohq.com" >> .env
          npm install
          npm run build

      # Step 4: Deploy frontend dist to Hostinger
      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /public_html/
          port: 21
          protocol: ftp
          security: loose

