<!DOCTYPE html>
<html>
<head><title>Auth Bridge</title></head>
<body>
<script>
  // Read current auth state from infinitohq.com localStorage
  const user = localStorage.getItem('user');
  const token = localStorage.getItem('authtoken');

  // Send to whoever embedded this iframe
  window.parent.postMessage({
    type: 'auth-bridge',
    user: user,
    token: token
  }, '*');
</script>
</body>
</html>
